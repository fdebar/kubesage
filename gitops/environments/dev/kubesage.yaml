# This is the API configuration
api:
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1
  # This is for setting up the metrics for the container more information can be found here: https://prometheus.io/docs/concepts/metric_collection/
  # and here: https://github.com/prometheus-operator/kube-prometheus/blob/main/Documentation/servicemonitor.md
  metrics:
    enabled: true
    additionalLabels:
      release: monitoring
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/fdebar/kubesage
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: a1a2918
  # This is for setting up the resources for the container more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 8000
# This is the worker configuration
worker:
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1
  # This is for setting up the metrics for the container more information can be found here: https://prometheus.io/docs/concepts/metric_collection/
  # and here: https://github.com/prometheus-operator/kube-prometheus/blob/main/Documentation/servicemonitor.md
  metrics:
    enabled: true
    port: 9090
    additionalLabels:
      release: monitoring
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/fdebar/kubesage
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: a1a2918
  # This is for setting up the resources for the container more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
# This is the application configuration
application:
  logLevel: INFO
  environment: production
# This is the OpenAI configuration
openai:
  apiKey: "ollama"
  endpoint: "http://host.minikube.internal:11434/v1"
  model: "qwen2.5-coder:14b"
# This is the observability configuration
observability:
  # This sets the URL for Prometheus.
  prometheus: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  # This sets the URL for Grafana.
  grafana: http://monitoring-grafana.monitoring.svc.cluster.local:3000
  # This sets the URL for Loki.
  loki: http://monitoring-loki.monitoring.svc.cluster.local:3100
  # This sets the URL for Tempo.
  tempo: http://monitoring-tempo.monitoring.svc.cluster.local:4318/v1/traces
