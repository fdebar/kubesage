kube-prometheus-stack:
  grafana:
    adminUser: admin
    adminPassword: kubesage-admin
    service:
      type: ClusterIP
      port: 80
    persistence:
      enabled: true
      size: 5Gi
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://monitoring-loki.monitoring.svc.cluster.local:3100
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          derivedFields:
            - name: TraceID
              matcherRegex: "trace_id=(\\w+)"
              datasourceUid: tempo
              url: "${__value.raw}"
        secureJsonData:
          httpHeaderValue1: kubesage

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://monitoring-tempo.monitoring.svc.cluster.local:3200
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: kubesage
    plugins:
      - grafana-piechart-panel
    grafana.ini:
      server:
        domain: localhost
      users:
        allow_sign_up: false
      analytics:
        reporting_enabled: false