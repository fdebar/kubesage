kube-prometheus-stack:
  grafana:
    enabled: true
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 15d
  alertmanager:
    enabled: true
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

# Loki subchart configuration
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
  
  # Inner Loki chart config
  loki:
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin