kube-prometheus-stack:
  grafana:
    enabled: true
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 15d
  alertmanager:
    enabled: true
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

# Loki subchart configuration
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  
  # Inner Loki chart config
  loki:
      # Schema configuration required by Loki v6+
      schemaConfig:
        configs:
          - from: 2024-04-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin