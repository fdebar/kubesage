---
apiVersion: v1
kind: Pod
metadata:
  name: stress-test-pod
  labels:
    app: stress-test
spec:
  containers:
  - name: stress-ng
    image: alexeiled/stress-ng
    args: ["--cpu", "2", "--vm", "1", "--vm-bytes", "512M", "--timeout", "600s"]
    resources:
      requests:
        memory: "256Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "3"