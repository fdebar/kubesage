apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubesage.fullname" . }}-migration
  labels:
    {{- include "kubesage.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kubesage.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}{{- if .Values.api.image.digest }}@{{ .Values.api.image.digest }}{{- end }}"
        imagePullPolicy: "{{ .Values.api.image.pullPolicy }}"
        command:
          - alembic
          - upgrade
          - head
        env:
          - name: AI_API_KEY
            value: {{ .Values.ai.apiKey | default "" | quote }}
          - name: DATABASE_HOST
            value: {{ .Values.database.host | quote }}
          - name: DATABASE_PORT
            value: {{ .Values.database.port | quote }}
          - name: DATABASE_NAME
            value: {{ .Values.database.name | quote }}
          - name: DATABASE_USER
            value: {{ .Values.database.username | quote }}
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.existingSecret }}
                key: {{ .Values.database.passwordKey }}