apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubesage.fullname" . }}-migration
  labels:
    {{- include "kubesage.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config/configmap.yaml") . | sha256sum }}
        checksum/ai-secret: {{ include (print $.Template.BasePath "/secrets/ai.yaml") . | sha256sum }}
      labels:
        {{- include "kubesage.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}{{- if .Values.api.image.digest }}@{{ .Values.api.image.digest }}{{- end }}"
        imagePullPolicy: "{{ .Values.api.image.pullPolicy }}"
        command:
          - alembic
          - upgrade
          - head
        envFrom:
          - configMapRef:
              name: {{ include "kubesage.fullname" . }}-config
          - secretRef:
              name: {{ include "kubesage.fullname" . }}-ai-secret
        env:
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.existingSecret }}
                key: {{ .Values.database.passwordKey }}
