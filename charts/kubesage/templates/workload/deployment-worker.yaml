---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubesage.fullname" . }}-worker
  labels:
    {{- include "kubesage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubesage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config/configmap.yaml") . | sha256sum }}
        checksum/ai-secret: {{ include (print $.Template.BasePath "/secrets/ai.yaml") . | sha256sum }}
      labels:
        {{- include "kubesage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "kubesage.serviceAccountName" . }}
      containers:
      - name: {{ include "kubesage.fullname" . }}-worker
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}{{- if .Values.worker.image.digest }}@{{ .Values.worker.image.digest }}{{- end }}"
        imagePullPolicy: "{{ .Values.worker.image.pullPolicy }}"
        command:
          - kubesage-worker
        resources:
        {{- toYaml .Values.worker.resources | nindent 12 }}
        envFrom:
        - configMapRef:
            name: {{ include "kubesage.fullname" . }}-config
        - secretRef:
            name: {{ include "kubesage.fullname" . }}-ai-secret
        env:
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.existingSecret }}
                key: {{ .Values.database.passwordKey }}
        ports:
          - name: metrics
            containerPort: {{ .Values.worker.metrics.port }}
