apiVersion: v1
kind: Service
metadata:
  name:  {{ include "kubesage.fullname" . }}-api
  labels:
    {{- include "kubesage.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "kubesage.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  type: {{ .Values.api.service.type }}
