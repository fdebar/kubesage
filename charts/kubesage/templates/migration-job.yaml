{{- if .Values.postgresql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubesage.fullname" . }}-migration
  labels:
    {{- include "kubesage.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kubesage.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-postgresql
        image: busybox
        command:
          - sh
          - -c
          - |
            until nc -z {{ .Values.postgresql.fullnameOverride }} 5432;
            do
              echo "Waiting for postgres";
              sleep 2;
            done
      containers:
      - name: migration
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: "{{ .Values.api.image.pullPolicy }}"
        command:
          - alembic
          - upgrade
          - head
        envFrom:
          - configMapRef:
              name: {{ include "kubesage.fullname" . }}-config
          - secretRef:
              name: {{ include "kubesage.fullname" . }}-ai-secret
        env:
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.fullnameOverride }}
                key: password
{{- end }}
