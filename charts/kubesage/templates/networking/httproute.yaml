{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "kubesage.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "kubesage.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}

  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}

      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      backendRefs:
        - name: {{ $fullName }}-{{ .service.name }}
          port: {{ .service.port }}
          weight: 1
    {{- end }}
{{- end }}