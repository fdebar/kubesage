---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubesage.fullname" . }}-config
data:
  #TODO: fix the hardcoded password
  DATABASE_URL: postgresql+psycopg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "kubesage.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
  ENVIRONMENT: {{ .Values.application.environment | quote }}
  LOG_LEVEL: {{ .Values.application.logLevel | quote }}
  AI_MODEL: {{ .Values.ai.model | quote }}
  AI_URL: {{ .Values.ai.endpoint | quote }}
  AI_PROVIDER: {{ .Values.ai.provider | quote }}
  PROMETHEUS_URL: {{ .Values.observability.prometheus.url | quote }}
  LOKI_URL: {{ .Values.observability.loki.url | quote }}
  OTLP_ENDPOINT: {{ .Values.observability.tempo.url | quote }}
