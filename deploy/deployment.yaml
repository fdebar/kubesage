---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesage
  namespace: kubesage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubesage
  template:
    metadata:
      labels:
        app: kubesage
    spec:
      serviceAccountName: kubesage
      containers:
      - name: kubesage
        image: kubesage:0.10
        imagePullPolicy: Never # local only (minikube)
        envFrom:
        - configMapRef:
            name: kubesage-config
        - secretRef:
            name: kubesage-secret
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
