[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubesage"
version = "0.11.0"
description = "AI-powered Kubernetes incident analysis assistant"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "kubernetes",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-exporter-otlp",
    "structlog"
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.0",
    "pytest>=9.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pip_audit>=2.10.0"
]

[project.scripts]
kubesage = "kubesage.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
# Exclude a variety of common directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.bandit]
# Exclude directories
exclude_dirs = [
    "tests",
    ".venv",
    ".git",
    "__pycache__",
]

# Ignore les asserts dans les tests
skips = [
    "B101",
]