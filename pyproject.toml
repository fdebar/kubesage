[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubesage"
version = "0.1.0"
description = "AI-powered Kubernetes incident analysis assistant"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "openai",
    "kubernetes",
    "pyyaml",
]

[project.scripts]
kubesage = "kubesage.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]