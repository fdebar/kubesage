[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubesage"
version = "0.11.0"
description = "AI-powered Kubernetes incident analysis assistant"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.19.1",
    "httpx2>=2.10.0",
    "fastapi>=0.141.0",
    "kubernetes>=30.1.0",
    "msgpack>=1.2.1",
    "prometheus-client>=0.25.0",
    "python-dotenv>=1.0.0",
    "openai>=2.53.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "psycopg[binary]>=3.3.3",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.52.0",
]


[dependency-groups]
dev = [
    "bandit>=1.9.0",
    "pytest>=9.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pip_audit>=2.10.0"
]

[project.scripts]
kubesage = "kubesage.cli.main:main"
kubesage-worker = "kubesage.worker.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
# Exclude a variety of common directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.bandit]
# Exclude directories
exclude_dirs = [
    "tests",
    ".venv",
    ".git",
    "__pycache__",
]

# Ignore les asserts dans les tests
skips = [
    "B101",
]