name: KubeSage Helm Chart

on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
permissions:
  contents: read

jobs:
  helm-test:
    name: Helm Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: make helm-lint

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: |
            kubesage:helm-test

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: kind-kubesage

      - name: Load Docker image into Kind
        run: |
          kind load docker-image kubesage:helm-test \
            --name kind-kubesage

      - name: Deploy Helm chart
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build charts/kubesage
          helm upgrade --install kubesage ./charts/kubesage \
            --namespace kubesage \
            --create-namespace \
            --set api.image.repository=kubesage \
            --set api.image.tag=helm-test \
            --set api.resources.requests.memory=56Mi \
            --set api.resources.requests.cpu=50m \
            --set worker.image.repository=kubesage \
            --set worker.image.tag=helm-test \
            --set worker.resources.requests.memory=56Mi \
            --set worker.resources.requests.cpu=50m \
            --set ai.apiKey=ollama \
            --set ai.provider=ollama \
            --set postgresql.primary.persistence.enabled=false

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/kubesage-api \
            -n kubesage \
            --timeout=360s

      - name: Dump logs if failed
        if: failure()
        run: |
          kubectl get all -n kubesage
          kubectl get jobs -n kubesage
          kubectl describe deployment/kubesage-api -n kubesage
          kubectl describe job kubesage-migration -n kubesage
          kubectl describe pod kubesage-postgresql-0 -n kubesage
          kubectl logs kubesage-postgresql-0 -n kubesage

  publish:
    name: Publish Helm Chart
    needs: helm-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Build Helm dependencies
        run: |
          helm repo add postgresql https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build ./charts/kubesage

      - name: Package Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package ./charts/kubesage \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist

      - name: Push Helm chart
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push dist/kubesage-*.tgz oci://ghcr.io/${OWNER}/charts