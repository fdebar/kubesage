name: KubeSage Docker
permissions:
  contents: read
  packages: write
on:
  # TODO: Update the rules once the project is sufficiently mature
  push:
    tags:
      - 'v\d+\.\d+\.\d+'
  workflow_dispatch:

jobs:
  changes:
    name: Detect docker changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - '**/*.py'
              - 'Dockerfile'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'requirements.txt'

  docker:
    name: Docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}:latest

      - name: Scan Docker image
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}
          trivy-config: trivy.yaml

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update image tag
        if: success()
        run: |
          yq -i '.image.tag = "${{ steps.vars.outputs.sha_short }}"' \
            gitops/environments/dev/kubesage.yaml

      - name: Commit updated values
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@noreply.github.com"

          git add gitops/environments/dev/kubesage.yaml

          git diff --cached --quiet && exit 0

          git commit -m "chore: deploy ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push