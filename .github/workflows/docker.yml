name: KubeSage Docker
permissions:
  contents: write
  packages: write
on:
  push:
    tags:
      - 'v\d+\.\d+\.\d+'
  workflow_dispatch:

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set image metadata
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          VERSION="${GITHUB_REF_NAME}"

          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: kubesage:security-scan

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kubesage:security-scan
          trivy-config: trivy.yaml

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: fdebar/kubesage-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update GitOps Kubesage version
        if: success()
        run: |
          yq -i '.api.image.tag = "${{ steps.vars.outputs.version }}"' \
            gitops/environments/dev/kubesage.yaml
          yq -i '.api.image.digest = "${{ steps.build.outputs.digest }}"' \
            gitops/environments/dev/kubesage.yaml

          yq -i '.worker.image.tag = "${{ steps.vars.outputs.version }}"' \
            gitops/environments/dev/kubesage.yaml
          yq -i '.worker.image.digest = "${{ steps.build.outputs.digest }}"' \
            gitops/environments/dev/kubesage.yaml

          yq -i '.spec.sources[0].targetRevision = "${{ steps.vars.outputs.version }}"' \
            gitops/applications/kubesage.yaml

          echo "GitOps changes:"
          git -C gitops diff

      - name: Create GitOps pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: main
          branch: automation/kubesage-${{ steps.vars.outputs.version }}
          delete-branch: true
          title: "chore: deploy KubeSage ${{ steps.vars.outputs.version }} to dev"
          commit-message: "chore: deploy KubeSage ${{ steps.vars.outputs.version }} to dev"
          body: |
            ## KubeSage release

            This PR updates the development environment to:

            **KubeSage:** `${{ steps.vars.outputs.version }}`

            Docker image:

            `ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.version }}`

            ### Validation

            - Docker image built successfully
            - Docker image scanned with Trivy
            - GitOps CI will validate:
              - Monitoring Helm chart
              - KubeSage Helm chart
              - Argo CD Applications

            This PR was automatically created by the KubeSage release workflow.
          labels: |
            automated
            deployment
