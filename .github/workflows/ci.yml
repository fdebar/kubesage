name: KubeSage CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys:
            |
              ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          make install
          
      - name: Run Code Quality
        run: |
          make format 
          make lint 
          make typecheck

      - name: Run Tests
        run: |
          make test

      - name: Scan repository with Bandit and pip_audit
        run: |
          make bandit
          make pip_audit

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

  docker:
    name: Docker
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/kubesage:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/kubesage:${{ steps.vars.outputs.sha_short }}
          trivy-config: trivy.yaml
      
      - name: Run container
        run: |
          docker run -d \
            --name kubesage \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}/kubesage:${{ steps.vars.outputs.sha_short }}
            
      - name: Wait container to be ready
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          exit 1
        
      - name: Check container health
        run: curl --fail http://localhost:8000/health

      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/kubesage:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/kubesage:latest

  helm:
    name: Helm
    needs: 
      - quality
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Helm package
        run: make package
