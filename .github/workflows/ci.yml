name: KubeSage CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys:
            |
              ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          make install
          
      - name: Run CI
        run: |
          make ci

      - name: Security scan
        run: |
          make security

      - name: Scan repository
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kubesage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: kubesage:${{ github.sha }}
          trivy-config: trivy.yaml
      
      - name: Run container
        run: |
          docker run -d \
            --name kubesage \
            -p 8000:8000 \
            kubesage:${{ github.sha }}
            
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          exit 1
        
      - name: Health check
        run: curl --fail http://localhost:8000/health