name: KubeSage CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys:
            |
              ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          
      - name: Run CI
        run: |
          make ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kubesage:0.12.0-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d \
            --name kubesage \
            -p 8000:8000 \
            kubesage:0.12.0-dev
            
      - name: Wait for application
        run: sleep 12
        
      - name: Health check
        run: curl --fail http://localhost:8000/health