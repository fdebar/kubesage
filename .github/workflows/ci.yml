name: KubeSage CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'Makefile'
              - 'tests/**'
              - 'migrations/**'
              - 'alembic.ini'
              - 'uv.lock'

  security:
    name: Repository secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Code Quality Checks
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kubesage
          POSTGRES_PASSWORD: kubesage
          POSTGRES_DB: kubesage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://kubesage:kubesage@localhost:5432/kubesage_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: uv sync

      - name: Run Database migrations
        run: make db-upgrade

      - name: Run Code Quality
        run: |
          make format 
          make lint 
          make typecheck

      - name: Run Unit Tests
        run: make test

      - name: Scan for Security Issues in Python code
        run: |
          make bandit
          make pip_audit

      - name: Scan for Security Issues in filesystem mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
